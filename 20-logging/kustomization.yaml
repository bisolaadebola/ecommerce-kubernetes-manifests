apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

commonAnnotations:
  argocd.argoproj.io/sync-wave: "2"

resources:
  - opensearch.yaml
  - opensearch-dashboards.yaml
  - ingress-logs.yaml # https://logs.bfithub.store (basic auth)

# Secret "basic-auth" (for logs.bfithub.store) is NOT stored in Git -
# create it with create-secrets.sh.

# Image tags - updated automatically by the ecommerce-final-project pipeline
images:
  - name: 619758066399.dkr.ecr.us-east-1.amazonaws.com/ecomerce/opensearch
    newTag: "10"
