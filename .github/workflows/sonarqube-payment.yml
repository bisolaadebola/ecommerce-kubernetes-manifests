name: SonarQube Payment Service Analysis

on:
  push:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/sonarqube-payment.yml"
  pull_request:
    branches:
      - main
    paths:
      - "payment-service/**"
      - ".github/workflows/sonarqube-payment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyze Payment Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install payment service dependencies
        working-directory: payment-service
        run: npm ci

      # TEMPORARY: remove this step once the SonarQube scan passes.
      # It never prints the token, only whether it is set and valid.
      - name: Debug Sonar connection
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          [ -n "$SONAR_TOKEN" ] && echo "token: set" || echo "token: MISSING"
          [ -n "$SONAR_HOST_URL" ] && echo "host: set" || echo "host: MISSING"
          echo "Token valid?"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/authentication/validate" || true
          echo
          echo "Project visible?"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/projects/search?projects=payment-service" || true
          echo

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: payment-service
          args: >
            -Dsonar.projectKey=payment-service
            -Dsonar.projectName="Payment Service"
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,coverage/**